name: "Lexicum"
description: Lexicum è un modulo Drupal che installa i vocabolari utilizzati dai Comuni.
package: "Municipes"

type: module
core_version_requirement: ^10.3 || ^11
dependencies:
  - drupal:field
  - drupal:language
  - drupal:locale
  - drupal:text
  - drupal:taxonomy
  - drupal:media
  - drupal:media_library
  - drupal:pathauto
  - drupal:color_field
  - municipes:bibliotheca
